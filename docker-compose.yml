# JitArchives 正式系统编排（阶段二第五批 · 功能四）
# 一键部署基线：镜像不含任何密钥，配置经环境变量注入；数据持久化到命名卷。
# 注意：本批开发机未安装 Docker，此文件为静态交付，未做容器实跑验证。
services:
  jitarchives:
    build:
      context: .
      dockerfile: Dockerfile
    image: jitarchives:0.2.0
    container_name: jitarchives
    restart: unless-stopped
    ports:
      - "5006:5006"
    environment:
      JIT_HOST: 0.0.0.0
      JIT_PORT: "5006"
      JIT_DB_FILE: /data/jitarchives.db
      JIT_FILE_STORE: /data/file-store
      JIT_MAX_UPLOAD_MB: "100"
      # JitWord 接入密钥仅在此注入（切勿写入镜像或提交到仓库）；未配置则在线编辑返回 503，不影响其余功能。
      # JITWORD_API: https://inner.jitword.com/api/v1
      # JITWORD_TENANT_KEY: ""
      # JITWORD_PROVIDER_KEY: ""
      # JITWORD_CLIENT_SECRET: ""
      # 票据 origin 默认按浏览器实际访问地址自动解析，公网 HTTPS 域名无需登记。
      # 如需强制旧版严格白名单，再开启下面两项：
      # JITWORD_ORIGIN_STRICT: "1"
      # JITWORD_ORIGIN: "https://archive.jitword.com"
    volumes:
      - jitarchives-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5006/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  jitarchives-data:
